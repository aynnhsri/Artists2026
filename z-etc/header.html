<!DOCTYPE html>
<head>
    <title>Artists 2026 - Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Quesha&family=Playfair+Display+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Quesha', sans-serif;
            background-color: #f4f4f4;
        }
        .header {
            width: 100%;
            height: 100px;
            background: 
            url('header bg.png') no-repeat center bottom, 
        linear-gradient(to right, #003d0c, #05701b);
            background-size: cover;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .logo {
            height: 90px;
            margin-right: 20px;
            position: relative; /* Ensures it's on top */
            z-index: 2;
        }
        .site-title {
            font-family: 'Playfair Display SC', serif;
            color: #fff;
            font-size: 3.5rem;
            flex-grow: 1;
            text-align: center;
            position: relative; /* Ensures it's on top */
            z-index: 2;
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="logo.png" alt="Artists 2026 Logo" class="logo">
        <h1 class="site-title">Artists 2026</h1>
    </header>
</body>
</html>
