<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f6f6f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 100, 0, 0.1);
            z-index: -1;
        }

        .circle.large {
            width: 500px;
            height: 500px;
            top: -150px;
            left: -100px;
        }

        .circle.large2 {
            width: 450px;
            height: 450px;
            top: 100px;
            right: -150px;
        }

        .circle.large3 {
            width: 500px;
            height: 500px;
            bottom: -200px;
            left: 50px;
        }

        .circle.medium {
            width: 300px;
            height: 300px;
            bottom: 50px;
            right: 100px;
        }

        .circle.medium2 {
            width: 280px;
            height: 280px;
            top: 250px;
            left: -100px;
        }

        .container {
            height: 550px;
            width: 80%;
            max-width: 1200px;
            padding: 20px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: 10px 0;
        }

        h1 {
            text-align: center;
            color: #006400;
            font-size: 45px;
            margin: 30px 0;
        }

        .achievements {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .achievement-card {
            height: 480px;
            background: #e9f5ec;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .achievement-card img {
            width: 250px;
            height: 350px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .achievement-card h2 {
            font-size: 18px;
            color: #2d6a4f;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="circle large"></div>
    <div class="circle large2"></div>
    <div class="circle large3"></div>
    <div class="circle medium"></div>
    <div class="circle medium2"></div>

    <h1> Achievements</h1>
    <div class="container">
        <div class="achievements">
            <div class="achievement-card">
                <img src="images/power dance.jpg" alt="Trophy">
                <h2>Rank 2 - Power Dance</h2>
            </div>
            <div class="achievement-card">
                <img src="images/model class 1.jpg" alt="Medal">
                <h2>Rank 3 - Model Class <br>(1st Grading Period)</h2>
            </div>
            <div class="achievement-card">
                <img src="images/intramurals.png" alt="Sports">
                <h2>Rank 2 - Intramurals</h2>
            </div>
            <div class="achievement-card">
                <img src="images/model class 2.jpg" alt="Medal">
                <h2>Rank 3 - Model Class <br> (2nd Grading Period)</h2>
            </div>
        </div>
    </div>

</body>
</html>
